<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  
      <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#070b14" />
          <stop offset="50%" stop-color="#0f172a" />
          <stop offset="100%" stop-color="#020617" />
        </linearGradient>

        <!-- Brand Orange / Amber Gradient -->
        <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ff6b35" />
          <stop offset="50%" stop-color="#f97316" />
          <stop offset="100%" stop-color="#fbbf24" />
        </linearGradient>

        <!-- Cyan / Cobalt Gradient -->
        <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#06b6d4" />
          <stop offset="50%" stop-color="#3b82f6" />
          <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>

        <!-- Emerald / Teal Gradient -->
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#10b981" />
          <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>

        <!-- Glass Panel Gradients -->
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
        </linearGradient>
        <linearGradient id="glassLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#334155" stop-opacity="0.6" />
          <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
        </linearGradient>

        <!-- Subtle Glow Filters -->
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="35" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="ambientLight" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="80" />
        </filter>
        <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="8" result="coloredBlur" />
          <feMerge>
            <feMergeNode in="coloredBlur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
    

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="840" cy="202.5" r="270" fill="#0284c7" opacity="0.12" filter="url(#ambientLight)" />
  <circle cx="360" cy="438.75" r="236.24999999999997" fill="#ff6b35" opacity="0.09" filter="url(#ambientLight)" />
  <circle cx="600" cy="337.5" r="168.75" fill="#6366f1" opacity="0.10" filter="url(#ambientLight)" />

  <!-- Engineering Grid -->
  
      <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
        <line x1="75" y1="0" x2="75" y2="675" /><line x1="150" y1="0" x2="150" y2="675" /><line x1="225" y1="0" x2="225" y2="675" /><line x1="300" y1="0" x2="300" y2="675" /><line x1="375" y1="0" x2="375" y2="675" /><line x1="450" y1="0" x2="450" y2="675" /><line x1="525" y1="0" x2="525" y2="675" /><line x1="600" y1="0" x2="600" y2="675" /><line x1="675" y1="0" x2="675" y2="675" /><line x1="750" y1="0" x2="750" y2="675" /><line x1="825" y1="0" x2="825" y2="675" /><line x1="900" y1="0" x2="900" y2="675" /><line x1="975" y1="0" x2="975" y2="675" /><line x1="1050" y1="0" x2="1050" y2="675" /><line x1="1125" y1="0" x2="1125" y2="675" /><line x1="1200" y1="0" x2="1200" y2="675" />
        <line x1="0" y1="67.5" x2="1200" y2="67.5" /><line x1="0" y1="135" x2="1200" y2="135" /><line x1="0" y1="202.5" x2="1200" y2="202.5" /><line x1="0" y1="270" x2="1200" y2="270" /><line x1="0" y1="337.5" x2="1200" y2="337.5" /><line x1="0" y1="405" x2="1200" y2="405" /><line x1="0" y1="472.5" x2="1200" y2="472.5" /><line x1="0" y1="540" x2="1200" y2="540" /><line x1="0" y1="607.5" x2="1200" y2="607.5" /><line x1="0" y1="675" x2="1200" y2="675" />
      </g>
    

  <!-- Domain Scene Composition -->
  
    <g transform="translate(600, 337.5)">
      <!-- Mesh Interconnect Channels -->
      <path d="M-220,-80 L0,-140 L220,-80 L0,-20 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.7" />
      <path d="M-220,40 L0,-20 L220,40 L0,100 Z" fill="none" stroke="url(#orangeGrad)" stroke-width="1.5" opacity="0.7" />

      <!-- Pod Cluster 1 (Left Tier) -->
      <g transform="translate(-220, -20)">
        <polygon points="0,-50 60,-20 60,40 0,70 -60,40 -60,-20" fill="url(#glassGrad)" stroke="url(#cyanGrad)" stroke-width="2" />
        <circle cx="0" cy="10" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <circle cx="0" cy="10" r="5" fill="#38bdf8" filter="url(#nodeGlow)" />
      </g>

      <!-- Central Gateway Tier -->
      <g transform="translate(0, -60)">
        <polygon points="0,-65 80,-25 80,45 0,85 -80,45 -80,-25" fill="url(#glassGrad)" stroke="url(#orangeGrad)" stroke-width="2.5" />
        <circle cx="0" cy="10" r="22" fill="#0f172a" stroke="url(#orangeGrad)" stroke-width="1.5" />
        <circle cx="0" cy="10" r="8" fill="#ff6b35" filter="url(#nodeGlow)" />
      </g>

      <!-- Pod Cluster 2 (Right Tier) -->
      <g transform="translate(220, -20)">
        <polygon points="0,-50 60,-20 60,40 0,70 -60,40 -60,-20" fill="url(#glassGrad)" stroke="url(#cyanGrad)" stroke-width="2" />
        <circle cx="0" cy="10" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <circle cx="0" cy="10" r="5" fill="#38bdf8" filter="url(#nodeGlow)" />
      </g>

      <!-- Base Infrastructure Platform -->
      <g transform="translate(0, 80)">
        <polygon points="0,-40 180,20 0,80 -180,20" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" />
      </g>
    </g>
    
</svg>