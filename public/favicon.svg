<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322" />
      <stop offset="50%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Outer Rim / Border Luminous Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.7" />
    </linearGradient>

    <!-- Left Pillar (Electric Cyan to Royal Cobalt) -->
    <linearGradient id="leftPillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Center Diagonal Bridge (Ultraviolet to Neon Fuchsia) -->
    <linearGradient id="diagBridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#a855f7" />
      <stop offset="90%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Right Pillar (Solar Flame: Coral to Amber Gold) -->
    <linearGradient id="rightPillarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="85%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>

    <!-- Spark Flare Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Specular Highlight Gradient -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- 3D Overlap Drop Shadow -->
    <filter id="shadow3d" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-6" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Spark Glow -->
    <filter id="sparkGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#fbbf24" flood-opacity="0.95" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="0" y="0" width="512" height="512" rx="124" fill="url(#bgGrad)" />

  <!-- Luminous Rim Border -->
  <rect x="3.5" y="3.5" width="505" height="505" rx="121" fill="none" stroke="url(#rimGrad)" stroke-width="7" />

  <!-- Soft Ambient Backdrop Glows behind the monogram -->
  <g opacity="0.5" filter="url(#ambientBlur)">
    <circle cx="150" cy="220" r="110" fill="#0284c7" />
    <circle cx="260" cy="270" r="120" fill="#9333ea" />
    <circle cx="360" cy="200" r="100" fill="#ea580c" />
  </g>

  <!-- Monogram Geometry -->
  <g>
    <!-- Left Pillar -->
    <rect x="108" y="128" width="72" height="256" rx="36" fill="url(#leftPillarGrad)" />
    <!-- Left Pillar Specular Glint -->
    <rect x="116" y="136" width="14" height="200" rx="7" fill="url(#specularGrad)" />

    <!-- Center Diagonal Bridge (Casts 3D shadow onto left pillar) -->
    <line x1="144" y1="164" x2="368" y2="348" 
          stroke="url(#diagBridgeGrad)" 
          stroke-width="72" 
          stroke-linecap="round" 
          filter="url(#shadow3d)" />

    <!-- Right Pillar (Casts 3D shadow over the bridge bottom) -->
    <rect x="332" y="128" width="72" height="256" rx="36" fill="url(#rightPillarGrad)" filter="url(#shadow3d)" />
    <!-- Right Pillar Specular Glint -->
    <rect x="374" y="140" width="14" height="190" rx="7" fill="url(#specularGrad)" />

    <!-- Center Bridge Highlight Core -->
    <circle cx="256" cy="256" r="8" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Prominent AI Generative Diamond Spark (Crown on Right Pillar) -->
  <g transform="translate(368, 114)" filter="url(#sparkGlow)">
    <!-- 4-point Diamond Starburst -->
    <path d="M 0,-48 
             C 3.5,-16 16,-3.5 48,0 
             C 16,3.5 3.5,16 0,48 
             C -3.5,16 -16,3.5 -48,0 
             C -16,-3.5 -3.5,-16 0,-48 Z" 
          fill="url(#sparkGrad)" />
    <!-- Center Core Glow -->
    <circle cx="0" cy="0" r="9" fill="#ffffff" />
  </g>

  <!-- Secondary Ambient Micro-Star (Top-Left Accent) -->
  <g transform="translate(92, 112)" opacity="0.85">
    <path d="M 0,-20 C 1.8,-7 7,-1.8 20,0 C 7,1.8 1.8,7 0,20 C -1.8,7 -7,1.8 -20,0 C -7,-1.8 -1.8,-7 0,-20 Z" fill="#38bdf8" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Tertiary Micro-Spark (Bottom-Right Accent) -->
  <g transform="translate(424, 396)" opacity="0.7">
    <path d="M 0,-15 C 1.2,-5 5,-1.2 15,0 C 5,1.2 1.2,5 0,15 C -1.2,5 -5,1.2 -15,0 C -5,-1.2 -1.2,-5 0,-15 Z" fill="#fbbf24" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
</svg>